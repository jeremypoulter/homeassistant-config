esphome:
  name: esphome-web-f5a720
  friendly_name: ESP32 Audio Kit
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  board: esp-wrover-kit
  variant: esp32
  framework:
    type: esp-idf

psram:

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://sehraf/esphome-components@758d322d3cbc44f490c62ced2f8d50fa615371ef
    components: [ac101]
  - source: github://PxPert/a2dp_sink@4e6ab3864f7c08d8f931170a116d43c22d49767e
    components: [a2dp_sink]

i2c:
  sda: GPIO33
  scl: GPIO32
  frequency: 100kHz

ac101:

a2dp_sink:
  id: bt_hub
  name: ESP32 Audio Kit
  minimal_bluetooth: true
  auto_reconnect: true

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

media_source:
  - platform: sendspin
    id: sendspin_source
    sample_rate: 44100
    codecs: [flac, pcm]
    task_stack_in_psram: true
  - platform: a2dp_sink
    id: bluetooth_source
    a2dp_sink_id: bt_hub

i2s_audio:
  id: i2s_audio_bus
  i2s_lrclk_pin: GPIO26
  i2s_bclk_pin: GPIO27

speaker:
  - platform: i2s_audio
    id: audio_output
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO25
    channel: stereo
    sample_rate: 44100
    bits_per_sample: 16bit
    buffer_duration: 100ms

media_player:
  - platform: sendspin
    id: sendspin_group
    name: Sendspin Group Controls
  - platform: speaker_source
    id: audio_player
    name: ESP32 Audio Kit
    media_pipeline:
      speaker: audio_output
      format: FLAC
      num_channels: 2
      sample_rate: 44100
      sources:
        - sendspin_source
        - bluetooth_source

switch:
  - platform: gpio
    id: amplifier_enable
    pin: GPIO21
    name: Audio Amplifier
    restore_mode: ALWAYS_ON
    internal: true
  - platform: a2dp_sink
    id: bt_power
    type: bluetooth
    a2dp_sink_id: bt_hub
    name: Bluetooth Audio
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: a2dp_sink
    id: bt_connection
    type: connection
    a2dp_sink_id: bt_hub
    name: Bluetooth Connection
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
      mode:
        input: true
        pullup: true
    name: Key 3 Previous or Next
    filters:
      - delayed_off: 10ms
    on_multi_click:
      - timing:
          - ON FOR AT MOST 350ms
          - OFF FOR AT LEAST 10ms
        then:
          - if:
              condition:
                switch.is_on: bt_connection
              then:
                - media_player.previous: audio_player
              else:
                - media_player.previous: sendspin_group
      - timing:
          - ON FOR AT LEAST 350ms
        then:
          - if:
              condition:
                switch.is_on: bt_connection
              then:
                - media_player.next: audio_player
              else:
                - media_player.next: sendspin_group
  - platform: gpio
    pin:
      number: GPIO23
      inverted: true
      mode:
        input: true
        pullup: true
    name: Key 4 Play Pause or Bluetooth
    filters:
      - delayed_off: 10ms
    on_multi_click:
      - timing:
          - ON FOR AT MOST 350ms
          - OFF FOR AT LEAST 10ms
        then:
          - if:
              condition:
                switch.is_on: bt_connection
              then:
                - media_player.toggle: audio_player
              else:
                - media_player.toggle: sendspin_group
      - timing:
          - ON FOR AT LEAST 350ms
        then:
          - switch.toggle: bt_power
  - platform: gpio
    pin:
      number: GPIO18
      inverted: true
      mode:
        input: true
        pullup: true
    name: Key 5 Volume Down
    filters:
      - delayed_off: 10ms
    on_press:
      - if:
          condition:
            switch.is_on: bt_connection
          then:
            - media_player.volume_down: audio_player
          else:
            - media_player.volume_down: sendspin_group
  - platform: gpio
    pin:
      number: GPIO5
      inverted: true
      mode:
        input: true
        pullup: true
    name: Key 6 Volume Up
    filters:
      - delayed_off: 10ms
    on_press:
      - if:
          condition:
            switch.is_on: bt_connection
          then:
            - media_player.volume_up: audio_player
          else:
            - media_player.volume_up: sendspin_group
