- id: '1780740766587'
  alias: Check Weather
  description: ''
  triggers:
  - trigger: time
    at: '20:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  conditions: []
  actions:
  - action: weather.get_forecasts
    metadata: {}
    target:
      entity_id: weather.openweathermap
    data:
      type: daily
    response_variable: weather
  - action: ai_task.generate_data
    metadata: {}
    data:
      task_name: Look at the weather
      instructions: "You must decide if pool heating should be ON or OFF based on
        the forecast below. Output good: true or good: false.\nRULE: Count how many
        consecutive days have good weather over the next few days. 3 or more days
        within  the next day or two is good = true, fewer than 3  → bad: false\n\na
        good day would be 2 or more of the following \n- high temperature of 22°C
        or above\n- no rain, clouds, or wind.\n\nThe pool holds heat well, so a few
        rainy or cloudy days in a warm week do not matter.\n\nForecast data:\n## Weather
        forecast\n{{ weather }}"
      structure:
        good:
          description: true if the wearther is likely to be good for the next few
            days, else false
          required: true
          selector:
            boolean:
        summary:
          description: Quick summary of the weather, no more than 100 chars
          required: true
          selector:
            text:
      entity_id: ai_task.google_ai_task
    response_variable: result
  - action: input_text.set_value
    metadata: {}
    target:
      entity_id: input_text.weather_summary
    data:
      value: '{{ result.data.summary }}'
  - action: notify.mobile_app_fold7
    metadata: {}
    data:
      message: '{{ "Good" if result.data.good else "Bad" }}: {{ result.data.summary
        }}'
      title: 'Pool Weather Update '
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ result.data.good }}'
      sequence:
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id: input_boolean.weather_good
        data: {}
    default:
    - action: input_boolean.turn_off
      metadata: {}
      target:
        entity_id: input_boolean.weather_good
      data: {}
  mode: single
- id: '1781400000001'
  alias: 'Laundry: Washer finished'
  description: When the washing machine finishes, check if the dryer is still running.
    If so, wait for the dryer to finish before announcing both. Otherwise, announce
    just the washer.
  triggers:
  - trigger: state
    entity_id: sensor.washing_machine_job_state
    to: finish
  conditions:
  - condition: state
    entity_id: input_boolean.laundry_announcing
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    metadata: {}
    target:
      entity_id: input_boolean.laundry_announcing
    data: {}
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.dryer_operation_state
        state: run
      sequence:
      - wait_for_trigger:
        - platform: state
          entity_id: sensor.dryer_operation_state
          to: finished
        timeout:
          hours: 4
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ wait.completed }}'
          sequence:
          - action: script.laundry_announce
            continue_on_error: true
            metadata: {}
            data:
              message: Both the washer and dryer have finished
        default:
        - action: script.laundry_announce
          continue_on_error: true
          metadata: {}
          data:
            message: The washer has finished its cycle
    default:
    - action: script.laundry_announce
      continue_on_error: true
      metadata: {}
      data:
        message: The washer has finished its cycle
  - delay:
      seconds: 30
  - action: input_boolean.turn_off
    metadata: {}
    target:
      entity_id: input_boolean.laundry_announcing
    data: {}
  mode: single
