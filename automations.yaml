- id: octopus_auto_join_power_down
  alias: 'Octopus: Auto-join Power Down'
  description: Automatically join newly offered Octoplus Power Down events.
  triggers:
  - entity_id: event.octopus_energy_a_e350409d_octoplus_power_down_events
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ state_attr("event.octopus_energy_a_e350409d_octoplus_power_down_events",
      "available_events") | default([], true) | count > 0 }}'
  actions:
  - action: octopus_energy.join_octoplus_power_down_session_event
    data:
      event_code: '{{ (state_attr("event.octopus_energy_a_e350409d_octoplus_power_down_events",
        "available_events") | first)["code"] }}'
    target:
      entity_id: event.octopus_energy_a_e350409d_octoplus_power_down_events
  max: 10
  mode: queued
- id: octopus_lux_event_charge
  alias: 'Octopus: Schedule Lux event charging'
  description: Uses Lux AC charge slot 2 for Power Down and Free Electricity sessions.
  triggers:
  - attribute: start_time
    entity_id: calendar.octopus_energy_a_e350409d_octoplus_power_down
    id: power_down
    trigger: state
  - entity_id: calendar.octopus_energy_a_e350409d_octoplus_free_electricity_session
    event: start
    id: free_electricity
    offset: -00:01:00
    trigger: calendar
  conditions:
  - condition: template
    value_template: '{{ trigger.id != "power_down" or (trigger.to_state.attributes.start_time
      is not none and as_timestamp(trigger.to_state.attributes.start_time) > as_timestamp(now()))
      }}'
  actions:
  - variables:
      charge_end: '{{ as_local(as_datetime(state_attr("calendar.octopus_energy_a_e350409d_octoplus_power_down",
        "start_time"))).strftime("%H:%M:%S") if trigger.id == "power_down" else as_local(as_datetime(trigger.calendar_event.end)).strftime("%H:%M:%S")
        }}'
      charge_start: '{{ (now() if now() > as_local(as_datetime(state_attr("calendar.octopus_energy_a_e350409d_octoplus_power_down",
        "start_time"))) - timedelta(hours=3) else as_local(as_datetime(state_attr("calendar.octopus_energy_a_e350409d_octoplus_power_down",
        "start_time"))) - timedelta(hours=3)).strftime("%H:%M:%S") if trigger.id ==
        "power_down" else as_local(as_datetime(trigger.calendar_event.start)).strftime("%H:%M:%S")
        }}'
      session_end: '{{ as_local(as_datetime(state_attr("calendar.octopus_energy_a_e350409d_octoplus_power_down",
        "end_time"))) if trigger.id == "power_down" else as_local(as_datetime(trigger.calendar_event.end))
        }}'
      session_name: '{{ "Power Down" if trigger.id == "power_down" else "Free Electricity"
        }}'
      session_start: '{{ as_local(as_datetime(state_attr("calendar.octopus_energy_a_e350409d_octoplus_power_down",
        "start_time"))) if trigger.id == "power_down" else as_local(as_datetime(trigger.calendar_event.start))
        }}'
  - action: time.set_value
    data:
      time: '{{ charge_start }}'
    target:
      entity_id: time.lux_ac_charge_start2
  - action: time.set_value
    data:
      time: '{{ charge_end }}'
    target:
      entity_id: time.lux_ac_charge_end2
  - action: notify.mobile_app_fold7
    data:
      message: '{% if trigger.id == "power_down" %}Power Down acknowledged. Lux slot
        2 is set to charge from {{ charge_start[:5] }} to {{ charge_end[:5] }} before
        the {{ as_local(as_datetime(state_attr("calendar.octopus_energy_a_e350409d_octoplus_power_down",
        "start_time"))).strftime("%H:%M") }}-{{ as_local(as_datetime(state_attr("calendar.octopus_energy_a_e350409d_octoplus_power_down",
        "end_time"))).strftime("%H:%M") }} session.{% else %}Free Electricity session
        found. Lux slot 2 is set to charge from {{ charge_start[:5] }} to {{ charge_end[:5]
        }}.{% endif %}'
      title: Octopus session scheduled
  - delay:
      seconds: '{{ [0, (as_timestamp(session_start) - as_timestamp(now())) | int]
        | max }}'
  - variables:
      battery_charge_start: '{{ states("sensor.lux_battery_charge_total") | float(0)
        }}'
      battery_soc_start: '{{ states("sensor.lux_battery") | int(0) }}'
      import_start: '{{ states("sensor.octopus_energy_electricity_18l2141578_2000010841543_current_total_consumption")
        | float(0) }}'
  - delay:
      seconds: '{{ [0, (as_timestamp(session_end) - as_timestamp(now())) | int] |
        max }}'
  - delay:
      seconds: 60
  - action: time.set_value
    data:
      time: 00:00:00
    target:
      entity_id: time.lux_ac_charge_start2
  - action: time.set_value
    data:
      time: 00:00:00
    target:
      entity_id: time.lux_ac_charge_end2
  - action: notify.mobile_app_fold7
    data:
      message: '{{ session_name }} complete. Lux slot 2 has been removed. Grid import
        during the session: {{ (states("sensor.octopus_energy_electricity_18l2141578_2000010841543_current_total_consumption")
        | float(0) - import_start | float(0)) | round(3) }} kWh. Battery charged:
        {{ (states("sensor.lux_battery_charge_total") | float(0) - battery_charge_start
        | float(0)) | round(3) }} kWh. Battery SoC: {{ battery_soc_start }}% to {{
        states("sensor.lux_battery") | int(0) }}%.'
      title: Octopus session complete
  max: 2
  mode: parallel
- id: octopus_lux_power_down_cleanup_20260921
  alias: 'Octopus: Power Down cleanup 2026-09-21'
  description: One-off completion report for the Power Down session after its scheduling
    automation was updated.
  triggers:
  - at: '18:00:00'
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ now().strftime("%Y-%m-%d") == "2026-09-21" }}'
  actions:
  - variables:
      battery_charge_start: '{{ states("sensor.lux_battery_charge_total") | float(0)
        }}'
      import_start: '{{ states("sensor.octopus_energy_electricity_18l2141578_2000010841543_current_total_consumption")
        | float(0) }}'
  - delay:
      hours: 1
      minutes: 1
  - action: time.set_value
    data:
      time: 00:00:00
    target:
      entity_id: time.lux_ac_charge_start2
  - action: time.set_value
    data:
      time: 00:00:00
    target:
      entity_id: time.lux_ac_charge_end2
  - action: notify.mobile_app_fold7
    data:
      message: 'Power Down complete. Lux slot 2 has been removed. Grid import during
        the session: {{ (states("sensor.octopus_energy_electricity_18l2141578_2000010841543_current_total_consumption")
        | float(0) - import_start | float(0)) | round(3) }} kWh. Battery charged:
        {{ (states("sensor.lux_battery_charge_total") | float(0) - battery_charge_start
        | float(0)) | round(3) }} kWh.'
      title: Power Down complete
  - action: automation.turn_off
    target:
